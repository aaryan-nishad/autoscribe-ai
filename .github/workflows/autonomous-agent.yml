name: AutoScribe Autonomous Agent

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger AutoScribe scheduler
        run: |
          curl --fail-with-body \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://autoscribe-ai-one.vercel.app/api/scheduler/tick"